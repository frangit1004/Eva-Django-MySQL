{% extends 'jugadorapp/base.html' %}

{% block content %}
<!-- Pantalla agregada para confirmar antes de borrar un jugador de la plantilla. (MJ) -->
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header text-white text-center py-3" style="background-color: #d32f2f;">
                <h4 class="mb-0 fw-bold">CONFIRMAR BAJA</h4>
            </div>
            <div class="card-body p-5 bg-white text-center">
                <h5 class="fw-bold text-dark mb-3">Deseas borrar a este jugador?</h5>
                <p class="text-secondary mb-4">
                    {{ jugador.nombre }} {{ jugador.apellido }} - {{ jugador.posicion }}
                </p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold shadow-sm">SI, BORRAR JUGADOR</button>
                        <a href="{% url 'lista_jugadores' %}" class="btn btn-light border fw-bold text-secondary">CANCELAR Y VOLVER</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
