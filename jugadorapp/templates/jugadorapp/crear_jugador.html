{% extends 'jugadorapp/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header text-white text-center py-3" style="background-color: #d32f2f;">
                <h4 class="mb-0 fw-bold">FICHA DE INSCRIPCIÓN</h4>
            </div>
            <div class="card-body p-5 bg-white">
                <form method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4 text-secondary">
                        <p class="small text-uppercase mb-4 border-bottom pb-2">Complete los datos del nuevo integrante</p>
                        {{ form.as_p }}
                    </div>

                    <div class="d-grid gap-3 mt-4">
                        <button type="submit" class="btn btn-primary-custom btn-lg fw-bold shadow-sm">GUARDAR REGISTRO</button>
                        <a href="{% url 'lista_jugadores' %}" class="btn btn-light border fw-bold text-secondary">CANCELAR Y VOLVER</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
